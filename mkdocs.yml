site_name: "AJ tech notes"
site_url: "https://github.io/aj-learning" # Optional, update later

# Define the navigation sidebar structure
nav:
  - Home: index.md
  - REST: REST.md
  - Kafka: kafka.md
  - RAG: RAG.md
  - mysql:
      - Intro: mysql/readme.md
      - 1 commands: mysql/commands.md
      - 2 string functions: mysql/string functions.md
      - 3 refine commands: mysql/refine commands.md
      - 4 aggregate: mysql/aggregate.md
      - 5 dates: mysql/dates.md
      - 6 logical & comparator: mysql/logical & comparator.md
      - 7 constraints & alter: mysql/constraints & alter.md
      - 8 relations: mysql/relations.md
      - 9 views & SQL modes & window functions: mysql/views & SQL modes & window functions.md
      - 10 self SchemaDesign: mysql/self SchemaDesign.md
      - 12 DB triggers: mysql/DB triggers.md
  - servers:
      - proxy: servers/proxy.md
      - nginx:
          - overview: servers/nginx/nginx.md
          - k8s: servers/nginx/nginx-k8s.md
          - cloud: servers/nginx/nginx-cloud.md

# Choose a theme (the clean, popular "material" theme is recommended)
theme:
  name: material
  features:
    - content.code.copy # Adds the one-click copy button
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets # Needed if you are using --8<-- file inclusion
  - pymdownx.superfences # Required for syntax highlighting and nested blocks
